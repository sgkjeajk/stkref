name: Update Stock ETF Monitor
on:
  push:
    branches: [main]
    paths:
      - data/stock-tickers.json
      - scripts/market_service.py
      - scripts/google_price_fallback.py
      - scripts/github_market_update.py
      - .github/workflows/stock-monitor.yml
      - .github/workflows/stock-monitor-watchdog.yml
  schedule:
    # Strong launch windows: 12:07 am and 12:07 pm SGT. GitHub cron is
    # best effort, so these may start late.
    - cron: '7 4,16 * * *'
    # Full historical highs: 08:23, 14:23 and 20:23 SGT, away from :00 load.
    - cron: '23 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      lookupTicker:
        description: Optional ticker-only metadata lookup
        required: false
        default: ''
        type: string
      requestId:
        description: Optional browser request correlation ID
        required: false
        default: ''
        type: string
      checkerCycles:
        description: Optional checker cycle count
        required: false
        default: ''
        type: string
      refreshDividends:
        description: Refresh dividend and yield fields once
        required: false
        default: 'false'
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: stock-etf-monitor-${{ github.event_name == 'workflow_dispatch' && inputs.lookupTicker != '' && 'lookup' || 'update' }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ticker configuration limits
        run: python -m unittest discover -s tests -p 'test_market_service.py' -v
      - name: Retry failed dividend check during morning recovery window
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DIVIDEND_WORKFLOW: dividend-checker.yml
        run: python scripts/dividend_recovery.py
      - name: Retrieve verified market data or metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: stock-monitor.yml
          TRIGGER_EVENT: ${{ github.event_name }}
          REFRESH_DIVIDENDS: 'false'
          MANUAL_DIVIDENDS: ${{ github.event_name == 'workflow_dispatch' && inputs.refreshDividends == 'true' }}
          RUN_ID: ${{ github.run_id }}
          LOOKUP_TICKER: ${{ inputs.lookupTicker }}
          REQUEST_ID: ${{ inputs.requestId }}
          CHECKER_CYCLES: ${{ inputs.checkerCycles }}
          REFRESH_ATH: ${{ github.event_name != 'schedule' || github.event.schedule == '23 0,6,12 * * *' }}
        run: |
          config_settings="$(python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from market_service import read_config, validate
          cfg = validate(read_config())
          checker = cfg.get('priceChecker', {})
          categories = checker.get('categories', {})
          enabled = checker.get('enabled', True) and any(categories.get(k, True) for k in ('ETF', 'Stock', 'Fund'))
          print(int(checker.get('cycles', 30)), int(checker.get('intervalMinutes', 8)) * 60, 'true' if enabled else 'false', int(checker.get('maxActiveCheckers', 3)))
          PY
          )"
          set -- $config_settings
          config_run_count="${1:-30}"
          sleep_seconds="${2:-480}"
          checker_enabled="${3:-true}"
          max_active_checkers="${4:-3}"
          run_count=1
          if [ -z "$LOOKUP_TICKER" ]; then
            run_count="${CHECKER_CYCLES:-$config_run_count}"
            case "$run_count" in
              ''|*[!0-9]*) run_count="$config_run_count" ;;
            esac
            if [ "$checker_enabled" != "true" ] && [ "${REFRESH_ATH:-false}" != "true" ]; then
              run_count=1
            fi
          fi
          if [ "$TRIGGER_EVENT" = "workflow_dispatch" ] && [ "${MANUAL_DIVIDENDS:-false}" = "true" ]; then
            run_count=1
          fi
          if [ "${GITHUB_RUN_ID:-}" = "38573360802" ]; then
            run_count=1
          fi
          if [ "$run_count" != "1" ]; then
          export TOPUP_CHECKER_CYCLES="$run_count"
          export MAX_ACTIVE_CHECKERS="$max_active_checkers"
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          workflow = os.environ["WORKFLOW_FILE"]
          this_run = int(os.environ["RUN_ID"])
          topup_cycles = os.environ.get("TOPUP_CHECKER_CYCLES", "10")
          launch_threshold = int(os.environ.get("MAX_ACTIVE_CHECKERS", "3"))
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, url, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      content = response.read().decode("utf-8")
                      return json.loads(content) if content else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise SystemExit(f"GitHub API {method} {url} failed: {exc.code} {detail}")

          base = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs"
          active = []
          for status in ("queued", "in_progress"):
              payload = request("GET", f"{base}?status={status}&per_page=100")
              active.extend(payload.get("workflow_runs", []))
          unique = {run["id"]: run for run in active}
          count = len(unique)
          print(f"Active stock monitor price-checker runs before top-up: {count}; launch threshold: <= {launch_threshold}")
          for run in sorted(unique.values(), key=lambda x: x.get("created_at", "")):
              print(f"- {run['id']} {run['status']} {run.get('event')} {run.get('created_at')} {run.get('html_url')}")

          # Only one already-running checker should top up the queue.
          oldest_active_run = min(unique) if unique else this_run
          if this_run != oldest_active_run:
              print("Another older active checker can handle queue top-up.")
              raise SystemExit(0)

          if count <= launch_threshold:
              dispatch_url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches"
              request_id = "selftopup-" + dt.datetime.now(dt.timezone.utc).strftime("%Y%m%d%H%M%S%f")
              request("POST", dispatch_url, {"ref": "main", "inputs": {"lookupTicker": "", "requestId": request_id, "checkerCycles": topup_cycles}})
              print(f"Dispatched one extra {topup_cycles}x price checker: {request_id}")
          else:
              print("More than 3 active price-checker runs found; no extra checker dispatched.")
          PY
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$run_count" != "1" ] && [ "$TRIGGER_EVENT" = "schedule" ] && [ "${REFRESH_ATH:-false}" != "true" ]; then
            git fetch origin main
            if git show origin/main:market-data.json > /tmp/market-data.json 2>/dev/null; then
              if python -c "import datetime as dt, json, sys; data=json.load(open('/tmp/market-data.json', encoding='utf-8')); timestamp=data.get('last_check_completed_at') or data.get('generated_at'); checked_at=dt.datetime.fromisoformat(timestamp.replace('Z', '+00:00')) if timestamp else None; age=(dt.datetime.now(dt.timezone.utc)-checked_at).total_seconds() if checked_at else 999999; print(f'Latest stock monitor check age: {age / 60:.1f} minutes'); sys.exit(0 if age < 120 else 1)"
              then
                echo 'Very recent successful check found; queued scheduled run can stop.'
                exit 0
              fi
            fi
          fi
          for attempt in $(seq 1 "$run_count"); do
            echo "Stock monitor checker cycle $attempt of $run_count"
            python scripts/github_market_update.py
            git fetch origin main
            if [ "$(git rev-parse HEAD:data/stock-tickers.json)" != "$(git rev-parse origin/main:data/stock-tickers.json)" ]; then
              echo 'A newer configuration exists; its queued update will handle prices.'
              exit 0
            fi
            git add market-data.json data/stock-monitor.json data/lookups
            if ! git diff --cached --quiet; then
              git commit -m 'Update Stock ETF Monitor shared result'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            if [ "$attempt" -lt "$run_count" ]; then
              sleep "$sleep_seconds"
            fi
          done
          if [ "${MANUAL_DIVIDENDS:-false}" = "true" ]; then
            python scripts/dividend_update.py
            git add dividend-data.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update dividend data from Admin manual refresh'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

