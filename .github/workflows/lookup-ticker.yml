name: STKREF exact ticker metadata lookup
run-name: Metadata lookup for ${{ inputs.ticker }}
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Exact market ticker symbol
        required: true
        type: string
      request_id:
        description: Correlation ID from the admin page
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: stkref-metadata-lookup
  cancel-in-progress: false
  queue: max
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact-symbol metadata
        env:
          CHECKER_SINGLE_PASS: 'true'
          LOOKUP_TICKER: ${{ inputs.ticker }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python scripts/ticker_lookup.py
      - name: Publish lookup result for the admin
        env:
          LOOKUP_TICKER: ${{ inputs.ticker }}
        run: |
          TICKER_UPPER="$(printf '%s' "$LOOKUP_TICKER" | tr '[:lower:]' '[:upper:]')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "data/lookups/${TICKER_UPPER}.json"
          git commit -m "Publish verified metadata lookup for ${TICKER_UPPER}"
          git push origin HEAD:"$GITHUB_REF_NAME"
