name: STKREF ticker metadata lookup
run-name: Ticker metadata lookup test
on:
  push:
    branches: [metadata-lookup-e2e-test]
    paths:
      - '.github/workflows/lookup-ticker.yml'
  workflow_dispatch:
    inputs:
      ticker:
        description: Exact market ticker symbol
        required: true
        type: string
      request_id:
        description: Correlation ID for the admin request
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: stkref-metadata-lookup
  cancel-in-progress: false
  queue: max
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact-symbol metadata
        env:
          CHECKER_SINGLE_PASS: 'true'
          LOOKUP_TICKER: ${{ github.event_name == 'push' && 'A7RU.SI' || inputs.ticker }}
          REQUEST_ID: ${{ inputs.request_id || format('smoke-{0}', github.run_id) }}
        run: python scripts/github_market_update.py
      - name: Publish lookup result for the admin
        env:
          LOOKUP_TICKER: ${{ github.event_name == 'push' && 'A7RU.SI' || inputs.ticker }}
        run: |
          TICKER_UPPER="$(printf '%s' "$LOOKUP_TICKER" | tr '[:lower:]' '[:upper:]')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "data/lookups/${TICKER_UPPER}.json"
          git commit -m "Publish verified metadata lookup for ${TICKER_UPPER}"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Confirm complete metadata was returned
        env:
          LOOKUP_TICKER: ${{ github.event_name == 'push' && 'A7RU.SI' || inputs.ticker }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          ticker=os.environ['LOOKUP_TICKER'].strip().upper()
          result=json.loads(Path(f'data/lookups/{ticker}.json').read_text(encoding='utf-8'))
          if result.get('error'):
              raise SystemExit(result['error'])
          item=result.get('instrument') or {}
          missing=[key for key in ('ticker','name','region','type','metadata_source') if not item.get(key)]
          if item.get('ticker') != ticker or missing:
              raise SystemExit(f'Lookup incomplete: ticker mismatch or missing fields {missing}')
          print(json.dumps(item, ensure_ascii=False))
          PY
