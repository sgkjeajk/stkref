name: Checker Watchdog
on:
  # Bootstrap only: each price checker replenishes its own queue directly.
  # Do not depend on recursively chained workflow_run events for continuity.
  schedule:
    # Independent recovery when a completion event or scheduled launch is delayed.
    - cron: '1/5 16-23 * * 0-4'
    - cron: '1/5 0-15 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/checker-watchdog.yml'
      - 'scripts/checker_queue.py'
      - 'scripts/checker_once.py'
      - 'scripts/github_market_update.py'
      - 'scripts/copy_market_data.py'
      - 'tests/test_*.py'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: stkref-replenishment
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test replenishment and copy protections
        run: python -m unittest discover -s tests -v
      - name: Start one seed program only if the checker queue is empty
        env:
          QUEUE_MODE: bootstrap
          CHECKER_EVENT: bootstrap
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: task.yml
          GH_TOKEN: ${{ github.token }}
        run: python scripts/checker_queue.py
