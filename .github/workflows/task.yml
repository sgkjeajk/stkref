name: Task
on:
  schedule:
    - cron: '7,22,37,52 * * * 1-5'
      timezone: Asia/Singapore
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/stock-tickers.json'
      - 'scripts/github_market_update.py'
      - 'scripts/market_service.py'
      - 'scripts/market_hours.py'
      - 'scripts/google_price_fallback.py'
      - 'tests/test_market_service.py'
      - '.github/workflows/task.yml'
permissions:
  contents: write
concurrency:
  group: scheduled-work
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check
        run: python -m unittest discover -s tests -p 'test_market_service.py' -v
      - name: Process
        env:
          REFRESH_ATH: 'false'
          REFRESH_DIVIDENDS: 'false'
          REQUEST_ID: ${{ github.run_id }}
          TRIGGER_EVENT: workflow_dispatch
        run: python scripts/github_market_update.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-data.json data/stock-monitor.json data/lookups
          if ! git diff --cached --quiet; then
            git commit -m 'Update scheduled data'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No generated data changes.'
          fi
