name: Task
on:
  schedule:
    # Singapore weekdays: price checks every five minutes, expressed in UTC.
    - cron: '3/5 16-23 * * 0-4'
    - cron: '3/5 0-15 * * 1-5'
    # Refresh full historical highs at 08:23, 14:23 and 20:23 Singapore time.
    - cron: '23 0,6,12 * * 1-5'
  workflow_dispatch:
    inputs:
      refresh_ath:
        description: Also refresh all-time highs
        required: false
        default: false
        type: boolean
      checker_cycles:
        description: Number of checker cycles for this run (blank uses saved setting)
        required: false
        default: ''
        type: string
      force_price_check:
        description: Run a price check even if scheduled checking is off
        required: false
        default: false
        type: boolean
      automatic_topup:
        description: Internal queue top-up request
        required: false
        default: false
        type: boolean
      request_id:
        description: Optional request correlation ID
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'data/stock-tickers.json'
      - 'scripts/github_market_update.py'
      - 'scripts/market_service.py'
      - 'scripts/market_hours.py'
      - 'scripts/google_price_fallback.py'
      - 'scripts/checker_queue.py'
      - 'tests/test_market_service.py'
      - '.github/workflows/task.yml'
      - '.github/workflows/checker-watchdog.yml'
permissions:
  contents: write
  actions: write
jobs:
  queue:
    runs-on: ubuntu-latest
    concurrency:
      group: stkref-checker-queue
      cancel-in-progress: false
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Top up the active checker queue
        if: (github.event_name == 'schedule' && github.event.schedule != '23 0,6,12 * * 1-5') || inputs.automatic_topup == true
        env:
          QUEUE_MODE: queue
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: task.yml
          GH_TOKEN: ${{ github.token }}
          CHECKER_CYCLES: ${{ inputs.checker_cycles }}
          REFRESH_ATH: ${{ inputs.refresh_ath || false }}
        run: python scripts/checker_queue.py
      - name: Enforce the configured checker limit
        id: guard
        env:
          QUEUE_MODE: guard
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: task.yml
          GH_TOKEN: ${{ github.token }}
          FORCE_PRICE_CHECK: ${{ inputs.force_price_check || false }}
          REFRESH_ATH: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 0,6,12 * * 1-5') || inputs.refresh_ath || false }}
        run: python scripts/checker_queue.py
  update:
    needs: queue
    if: needs.queue.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: stkref-refresh-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check
        run: python -m unittest discover -s tests -p 'test_market_service.py' -v
      - name: Retrieve prices and history
        env:
          REFRESH_ATH: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 0,6,12 * * 1-5') || inputs.refresh_ath || false }}
          FORCE_PRICE_CHECK: ${{ inputs.force_price_check || false }}
          REQUEST_ID: ${{ inputs.request_id || github.run_id }}
          EVERYDAYCOMPASS_TOKEN: ${{ secrets.EVERYDAYCOMPASS_TOKEN }}
          TRIGGER_EVENT: ${{ inputs.automatic_topup == true && 'schedule' || github.event_name }}
          CHECKER_CYCLES: ${{ inputs.checker_cycles }}
        run: |
          settings="$(python - <<'PY'
          import json
          with open('data/stock-tickers.json', encoding='utf-8') as f:
              cfg=json.load(f)
          checker=cfg.get('priceChecker', {})
          print(int(checker.get('cycles', 1)), int(checker.get('intervalMinutes', 15))*60)
          PY
          )"
          set -- $settings
          run_count="${CHECKER_CYCLES:-${1:-1}}"
          sleep_seconds="${2:-900}"
          case "$run_count" in ''|*[!0-9]*) run_count="${1:-1}" ;; esac
          if [ "${REFRESH_ATH:-false}" = "true" ]; then run_count=1; fi
          if [ -n "${LOOKUP_TICKER:-}" ]; then run_count=1; fi
          if [ "$run_count" -lt 1 ]; then run_count=1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 "$run_count"); do
            echo "STKREF price checker cycle $attempt of $run_count"
            published=false
            for publish_attempt in 1 2 3; do
              # Each cycle must read the latest snapshot, not the checkout from hours ago.
              git fetch origin main
              if [ "$(git rev-parse HEAD:data/stock-tickers.json)" != "$(git rev-parse origin/main:data/stock-tickers.json)" ]; then
                echo 'Checker settings changed; stop and let the next run use them.'
                exit 0
              fi
              git reset --hard origin/main
              python scripts/github_market_update.py
              git add -A -- market-data.json data/stock-monitor.json
              if git diff --cached --quiet; then
                echo 'No snapshot changes to publish.'
                break
              fi
              git commit -m 'Update refreshed market data'
              if git push origin HEAD:main; then
                published=true
                break
              fi
              echo "Another writer advanced main; regenerate from its latest snapshot (attempt $publish_attempt)."
              if [ "$publish_attempt" -eq 3 ]; then
                echo '::error::Could not publish snapshot after three attempts.'
                exit 1
              fi
            done
            if [ "$published" = true ]; then
              if [ -n "${EVERYDAYCOMPASS_TOKEN:-}" ]; then
                curl --fail --silent --show-error --retry 3 \
                  -X POST 'https://api.github.com/repos/myai118/EverydayCompass/dispatches' \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${EVERYDAYCOMPASS_TOKEN}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -H 'Content-Type: application/json' \
                  --data '{"event_type":"stkref-refresh"}'
              else
                echo "::warning::EVERYDAYCOMPASS_TOKEN is not configured; the five-minute EverydayCompass fallback sync will copy this refresh later."
              fi
            fi
            if [ "$attempt" -lt "$run_count" ]; then
              sleep "$sleep_seconds"
            fi
          done
