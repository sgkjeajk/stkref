name: Task
on:
  schedule:
    # Singapore weekdays: 00:00-07:59 SGT (previous UTC day 16:00-23:59)
    - cron: '3/5 16-23 * * 0-4'
    # Singapore weekdays: 08:00-23:59 SGT (same UTC day 00:00-15:59)
    - cron: '3/5 0-15 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/stock-tickers.json'
      - 'scripts/github_market_update.py'
      - 'scripts/market_service.py'
      - 'scripts/market_hours.py'
      - 'scripts/google_price_fallback.py'
      - 'tests/test_market_service.py'
      - '.github/workflows/task.yml'
permissions:
  contents: write
concurrency:
  group: scheduled-work
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check
        run: python -m unittest discover -s tests -p 'test_market_service.py' -v
      - name: Process
        env:
          REFRESH_ATH: 'false'
          REFRESH_DIVIDENDS: 'false'
          REQUEST_ID: ${{ github.run_id }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: python scripts/github_market_update.py
      - name: Save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- market-data.json data/stock-monitor.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update scheduled data'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No generated data changes.'
          fi
